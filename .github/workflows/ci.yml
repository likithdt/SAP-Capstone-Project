name: CI Pipeline · Industrial IoT Digital Twin

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Code Quality, Linting & Syntax Validation
  # ---------------------------------------------------------------------------
  lint-and-syntax:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 ruff

      - name: Validate Python Syntax (All Modules)
        run: |
          python -m compileall -q src amazon scripts main.py

      - name: Validate Frontend JavaScript Syntax
        run: |
          node -c frontend/script.js

      - name: Run Ruff Linter
        run: |
          ruff check src scripts amazon --ignore E501,E402,F401,F841 || true

  # ---------------------------------------------------------------------------
  # 2. Automated Test Suite (Pytest & Coverage)
  # ---------------------------------------------------------------------------
  test-suite:
    name: Pytest Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Generate Simulated Datasets
        run: |
          python scripts/generate_simulated_dataset.py

      - name: Run Full Test Suite (All 9 Test Modules with Coverage)
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing

  # ---------------------------------------------------------------------------
  # 3. KPI Benchmarking & Live Demo Gate
  # ---------------------------------------------------------------------------
  kpi-benchmark-and-demo:
    name: Capstone KPI Benchmark & Jury Demo Gate
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Execute 4-Scenario Closed-Loop Jury Demo
        run: |
          python main.py demo

      - name: Execute System KPI Verification Benchmark
        run: |
          python main.py benchmark --samples 2

  # ---------------------------------------------------------------------------
  # 4. Security & Vulnerability Audit
  # ---------------------------------------------------------------------------
  security-audit:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Security Analysis
        run: |
          bandit -r src -ll -ii || true
